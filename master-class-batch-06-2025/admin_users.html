<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Progress – Admin | PT Experts</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script type="module" src="firebase-config.js"></script>

<style>
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:#f4f7fb;
}
header{
  background:#0a1a32;
  color:#fff;
  padding:1rem 1.5rem;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
header a{color:#22c55e;font-weight:600;text-decoration:none}
.logout{cursor:pointer;color:#facc15;font-weight:600}

.container{max-width:1200px;margin:auto;padding:2rem 1.5rem}

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
}
th,td{
  padding:.9rem;
  border-bottom:1px solid #e2e8f0;
}
th{background:#f1f5f9;font-weight:700}

.status-yes{color:#16a34a;font-weight:700}
.status-no{color:#dc2626;font-weight:700}

.progress-wrap{
  background:#e5e7eb;
  border-radius:8px;
  overflow:hidden;
  height:8px;
  margin:4px 0;
}
.progress-bar{
  height:100%;
  background:#22c55e;
}

button{
  padding:.4rem .8rem;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:700;
}
.approve{background:#22c55e;color:#fff}
.revoke{background:#ef4444;color:#fff}
.view{background:#2563eb;color:#fff}
.access{background:#0ea5e9;color:#fff}

.loading{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#64748b;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
}
.modal-box{
  background:#fff;
  width:460px;
  max-height:85vh;
  overflow:auto;
  border-radius:14px;
  padding:1.2rem;
}
.section{margin-bottom:14px}
.lesson{padding:.35rem 0}
.lesson.done{color:#16a34a}
.lesson.todo{color:#64748b}
.close{
  margin-top:12px;
  background:#0a1a32;
  color:#fff;
  width:100%;
  padding:.6rem;
  border:none;
  border-radius:10px;
}
</style>
</head>

<body>

<div id="loading" class="loading">Checking admin access…</div>

<div id="panel" style="display:none">

<header>
  <strong>👥 User Progress – Admin</strong>
  <div style="display:flex;gap:15px;align-items:center">
    <a href="masterclass_admin.html">⬅ Dashboard</a>
    <span class="logout" onclick="logout()">Logout</span>
  </div>
</header>

<div class="container">
<table>
<thead>
<tr>
  <th>Name</th>
  <th>Email</th>
  <th>Status</th>
  <th>Progress</th>
  <th>Action</th>
</tr>
</thead>
<tbody id="userRows"></tbody>
</table>
</div>
</div>

<!-- VIEW MODAL -->
<div id="modal" class="modal">
  <div class="modal-box">
    <h3>Lesson Progress</h3>
    <div id="lessonList"></div>
    <button class="close" onclick="closeModal()">Close</button>
  </div>
</div>

<!-- ACCESS MODAL -->
<div id="accessModal" class="modal">
  <div class="modal-box">
    <h3>Manage Access</h3>
    <div id="accessList"></div>
    <button class="close" onclick="closeAccess()">Save & Close</button>
  </div>
</div>

<script type="module">
import { onAuthStateChanged, signOut } from
  "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
  collection, getDocs, getDoc, doc, updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const auth = window.auth;
const db = window.db;
const COURSE_ID = "masterclass_batch_06_2025";

let cachedRecorded = [];
let cachedLive = [];
let cachedAssign = [];

let currentAccessUser = null;

/* AUTH */
onAuthStateChanged(auth, async user=>{
  if(!user) return location.href="masterclass_login.html";

  const adminSnap = await getDoc(doc(db,"admins",user.uid));
  if(!adminSnap.exists()){
    alert("Admin only");
    return location.href="masterclass_index.html";
  }

  await preloadLessons();
  await loadUsers();

  loading.style.display="none";
  panel.style.display="block";
});

/* PRELOAD ALL LESSONS ONCE (🚀 SPEED FIX) */
async function preloadLessons(){
  const [r,l,a] = await Promise.all([
    getDocs(collection(db,"courses",COURSE_ID,"recorded_classes")),
    getDocs(collection(db,"courses",COURSE_ID,"live_recorded_classes")),
    getDocs(collection(db,"courses",COURSE_ID,"assignments"))
  ]);

  cachedRecorded = r.docs;
  cachedLive = l.docs;
  cachedAssign = a.docs;
}

/* LOAD USERS */
async function loadUsers(){
  const rows = document.getElementById("userRows");
  rows.innerHTML = "";

  const usersSnap = await getDocs(collection(db,"users"));

  usersSnap.forEach(uDoc=>{
    const u = uDoc.data();
    const uid = uDoc.id;

    const rec = calcProgress(cachedRecorded, uid);
    const live = calcProgress(cachedLive, uid);
    const ass = calcProgress(cachedAssign, uid);

    rows.innerHTML += `
      <tr>
        <td>${u.name || "-"}</td>
        <td>${u.email || "-"}</td>
        <td class="${u.paid?"status-yes":"status-no"}">
          ${u.paid ? "Approved" : "Pending"}
        </td>
        <td>
          📘 Recorded ${rec.percent}%
          <div class="progress-wrap"><div class="progress-bar" style="width:${rec.percent}%"></div></div>

          🎥 Live ${live.percent}%
          <div class="progress-wrap"><div class="progress-bar" style="width:${live.percent}%"></div></div>

          📝 Assignments ${ass.percent}%
          <div class="progress-wrap"><div class="progress-bar" style="width:${ass.percent}%"></div></div>
        </td>
        <td>
          <button class="view" onclick="viewProgress('${uid}')">View</button>
          <button class="access" onclick="manageAccess('${uid}')">Access</button>
          ${
            u.paid
              ? `<button class="revoke" onclick="setPaid('${uid}',false)">Revoke</button>`
              : `<button class="approve" onclick="setPaid('${uid}',true)">Approve</button>`
          }
        </td>
      </tr>
    `;
  });
}

/* CALCULATE PROGRESS */
function calcProgress(list, uid){
  let done = 0;
  list.forEach(d=>{
    if(d.data().completedBy?.includes(uid)) done++;
  });
  return {
    total: list.length,
    done,
    percent: list.length ? Math.round(done/list.length*100) : 0
  };
}

/* VIEW DETAILS */
window.viewProgress = async uid=>{
  lessonList.innerHTML="";

  renderSection("📘 Recorded Classes", cachedRecorded, uid);
  renderSection("🎥 Live Recorded Classes", cachedLive, uid);
  renderSection("📝 Assignments", cachedAssign, uid);

  modal.style.display="flex";
};

function renderSection(title, list, uid){
  let done = 0;
  list.forEach(d=>{ if(d.data().completedBy?.includes(uid)) done++; });

  const percent = list.length ? Math.round(done/list.length*100) : 0;

  lessonList.innerHTML += `
    <div class="section">
      <strong>${title} – ${percent}%</strong>
      <div class="progress-wrap">
        <div class="progress-bar" style="width:${percent}%"></div>
      </div>
    </div>
  `;

  list.forEach(d=>{
    const ok = d.data().completedBy?.includes(uid);
    lessonList.innerHTML += `
      <div class="lesson ${ok?"done":"todo"}">
        ${ok?"✔":"⏳"} ${d.data().title}
      </div>
    `;
  });
}

/* ACCESS CONTROL */
window.manageAccess = async uid=>{
  currentAccessUser = uid;
  accessList.innerHTML="";

  const snap = await getDoc(doc(db,"users",uid));
  const access = snap.data().access || {};

  renderAccess("📘 Recorded Classes","recorded_classes",cachedRecorded,access);
  renderAccess("🎥 Live Recorded Classes","live_recorded_classes",cachedLive,access);
  renderAccess("📝 Assignments","assignments",cachedAssign,access);

  accessModal.style.display="flex";
};

function renderAccess(title,key,list,access){
  accessList.innerHTML += `<div class="section"><strong>${title}</strong></div>`;

  list.forEach(d=>{
    const checked = access[key]?.includes(d.id);
    accessList.innerHTML += `
      <div class="lesson">
        <input type="checkbox"
          ${checked?"checked":""}
          onchange="toggleAccess('${key}','${d.id}',this.checked)">
        ${d.data().title}
      </div>
    `;
  });
}

window.toggleAccess = async (type,id,checked)=>{
  const ref = doc(db,"users",currentAccessUser);
  const snap = await getDoc(ref);

  const access = snap.data().access || {};
  const list = new Set(access[type] || []);

  checked ? list.add(id) : list.delete(id);

  await updateDoc(ref,{ [`access.${type}`]: Array.from(list) });
};

window.closeModal = ()=> modal.style.display="none";
window.closeAccess = ()=> accessModal.style.display="none";

/* APPROVE / REVOKE */
window.setPaid = async (uid,val)=>{
  await updateDoc(doc(db,"users",uid),{ paid: val });
  loadUsers();
};

/* LOGOUT */
window.logout = async ()=>{
  await signOut(auth);
  location.href="masterclass_login.html";
};
</script>

</body>
</html>
