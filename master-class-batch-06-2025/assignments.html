<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Assignments – PT Experts Masterclass</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script type="module" src="firebase-config.js"></script>

<style>
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:#f4f7fb;
}
header{
  background:#0a1a32;
  color:#fff;
  padding:1rem 1.5rem;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
header a{
  color:#22c55e;
  font-weight:600;
  text-decoration:none;
}
.container{
  max-width:900px;
  margin:auto;
  padding:1.5rem;
}
.list{
  display:flex;
  flex-direction:column;
  gap:14px;
}
.card{
  background:#fff;
  padding:1.2rem 1.4rem;
  border-radius:14px;
  box-shadow:0 8px 22px rgba(0,0,0,.08);
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.card.locked{opacity:.6}
.card.disabled{opacity:.4}
.info{max-width:70%}

.badge{
  display:inline-block;
  margin-top:6px;
  padding:4px 10px;
  border-radius:20px;
  font-size:.75rem;
  font-weight:600;
}
.badge.locked{background:#fde68a;color:#92400e}
.badge.disabled{background:#e5e7eb;color:#374151}
.badge.open{background:#dcfce7;color:#166534}
.badge.done{background:#bbf7d0;color:#166534}

.btn{
  padding:8px 16px;
  border-radius:10px;
  font-weight:600;
  border:none;
  cursor:pointer;
  text-decoration:none;
}
.btn.open{background:#2563eb;color:#fff}
.btn.locked{background:#facc15;color:#92400e}
.btn.disabled{background:#e5e7eb;color:#6b7280}

.loading{
  min-height:70vh;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#64748b;
}
</style>
</head>

<body>

<header>
  <a href="masterclass_index.html">← Back</a>
  <span>Assignments</span>
</header>

<div class="container">
  <div id="loading" class="loading">Loading assignments…</div>
  <div id="list" class="list"></div>
</div>

<script type="module">
import { onAuthStateChanged } from
  "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
  collection,
  getDocs,
  doc,
  getDoc,
  updateDoc,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const auth = window.auth;
const db = window.db;

const COURSE_ID = "masterclass_batch_06_2025";

const list = document.getElementById("list");
const loading = document.getElementById("loading");

let currentUserId = null;
let allowedAssignments = [];

/* AUTH */
onAuthStateChanged(auth, async (user)=>{
  if(!user) return location.href="masterclass_login.html";

  currentUserId = user.uid;

  const userSnap = await getDoc(doc(db,"users",user.uid));
  if(!userSnap.exists() || userSnap.data().paid !== true){
    return location.href="masterclass_login.html";
  }

  allowedAssignments = userSnap.data().access?.assignments || [];

  loadAssignments();
});

/* LOAD ASSIGNMENTS */
async function loadAssignments(){
  list.innerHTML="";
  loading.style.display="flex";

  const q = query(
    collection(db,"courses",COURSE_ID,"assignments"),
    orderBy("order","asc")
  );

  const snap = await getDocs(q);

  snap.forEach(d=>{
    const a = d.data();

    // access control
    if (allowedAssignments.length && !allowedAssignments.includes(d.id)) return;

    const completed = a.completedBy?.includes(currentUserId);

    let state = "open";
    let badge = "Available";

    if (!a.enabled) {
      state = "disabled";
      badge = "Disabled";
    } else if (a.locked) {
      state = "locked";
      badge = "Locked";
    } else if (completed) {
      badge = "Completed";
    }

    const card = document.createElement("div");
    card.className = `card ${state}`;

    card.innerHTML = `
      <div class="info">
        <strong>${a.title}</strong>
        <p style="margin:.3rem 0;color:#475569">${a.description || ""}</p>
        <span class="badge ${completed ? "done" : state}">${badge}</span>
      </div>
      ${
        state === "open"
        ? `<a class="btn open" href="${a.submitUrl}" target="_blank"
             onclick="markDone('${d.id}')">Open</a>`
        : `<span class="btn ${state}">🔒</span>`
      }
    `;

    list.appendChild(card);
  });

  loading.style.display="none";
}

/* MARK COMPLETED */
window.markDone = async (id)=>{
  const ref = doc(db,"courses",COURSE_ID,"assignments",id);
  const snap = await getDoc(ref);
  const done = snap.data().completedBy || [];

  if(!done.includes(currentUserId)){
    await updateDoc(ref,{
      completedBy: [...done, currentUserId]
    });
  }
};
</script>

</body>
</html>
